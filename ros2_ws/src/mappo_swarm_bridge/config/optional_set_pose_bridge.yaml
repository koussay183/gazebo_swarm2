# Optional: SetEntityPose service bridge for experiment initialization ONLY
# ============================================================
# DO NOT use during normal flight operations.
# PX4 must be the sole controller of vehicle pose during flight.
#
# This bridge is ONLY for:
#   - Resetting drone positions at the start of an experiment
#   - Teleporting drones in Gazebo for test scenario setup
#   - NOT for control — it bypasses PX4 physics entirely
#
# To use:
#   1. Enable this bridge in ros_gz_bridge.launch.py
#   2. Call the service: ros2 service call /world/default/set_pose ...
#   3. DISABLE before enabling PX4 offboard control
# ============================================================

- service_name: /world/default/set_pose
  ros_type_name: ros_gz_interfaces/srv/SetEntityPose
  gz_type_name: gz.msgs.EntityPose
  direction: ROS_TO_GZ
